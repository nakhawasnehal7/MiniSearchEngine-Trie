<h1>Trees</h1><p>A tree is a hierarchical data structure. Binary search trees keep keys ordered, and balanced trees such as AVL trees guarantee logarithmic search. A trie is a tree used for strings. Trees are special graphs, see <a href="graphs.html">graphs</a>. Heaps are trees too: <a href="heaps.html">heaps</a>. Back to <a href="index.html">home</a>.</p>
