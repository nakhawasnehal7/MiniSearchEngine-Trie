<h1>Sorting</h1><p>Sorting arranges items in order.
    Merge sort and quick sort run in n log n time
    . Heap sort uses a <a href="heaps.html">heap</a>. Search engines sort results
    by rank. Sorting is not hashing, but see <a href="hashing.html">hashing</a> too.</p>
